[project]
name = "capstone-agents-backend"
version = "0.1.0"
description = "K Electronics Super Agent → Meeting Agent → Workflow Tool (LangGraph + Ollama Cloud)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-ollama>=0.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
