[project]
name = "capstone-agents-backend"
version = "0.1.0"
description = "Agent platform runtime + Group / K Electronics agent systems (LangGraph + Ollama Cloud, A2A over HTTP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-ollama>=0.3",
  "langchain-openai>=0.3",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "trafilatura>=2.0",
  "protego>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: the test calls a real model or website (outbound network allowed)"]
